name: Bug report
description: Something in the Mod Manager does not work
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Manager version
      description: Shown in the help window (F1), under ABOUT.
      placeholder: 1.1.0-experimental
    validations:
      required: true
  - type: input
    id: paks
    attributes:
      label: Game location you set
      description: The folder shown after "Game Location:" at the bottom of the window.
      placeholder: C:\Program Files (x86)\Steam\steamapps\common\TEKKEN 8\Polaris\Content\Paks
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Which mod, which root (Mods, ~mods or LogicMods), what you clicked.
