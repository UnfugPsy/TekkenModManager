name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip when the release already exists
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            "SKIP=true" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host "release $env:GITHUB_REF_NAME already exists; leaving the published files as they are"
          }
          $global:LASTEXITCODE = 0
      - uses: actions/setup-dotnet@v4
        if: env.SKIP != 'true'
        with:
          global-json-file: global.json
      - name: Build zips
        if: env.SKIP != 'true'
        shell: pwsh
        run: ./scripts/release.ps1
      - name: Check the tag matches the version
        if: env.SKIP != 'true'
        shell: pwsh
        run: |
          $zip = Get-ChildItem artifacts/release -Filter '*selfcontained.zip' | Select-Object -First 1
          $version = $zip.Name -replace '^TekkenModManager-(.+)-win-x64-selfcontained\.zip$', '$1'
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "tag $env:GITHUB_REF_NAME does not match version v$version in Directory.Build.props"
          }
      - name: Create the GitHub release
        if: env.SKIP != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem artifacts/release -Include '*.zip', 'SHA256SUMS.txt' -Recurse | ForEach-Object { $_.FullName })
          $flags = @()
          if ($env:GITHUB_REF_NAME -match '-') {
            $flags += '--prerelease'
          }
          gh release create $env:GITHUB_REF_NAME @assets --title $env:GITHUB_REF_NAME --notes-file artifacts/release/notes.md @flags
